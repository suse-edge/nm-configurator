[package]
name = "nmc"
version = "0.3.6"
edition = "2021"
authors = ["Atanas Dinov <atanas.dinov@suse.com>"]
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["cargo"] }
env_logger = "0.11.11"
log = "0.4.34"
nmstate = { version = "2.2.62", features = ["gen_conf"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
configparser = "3.3.0"
